<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gülhane Tıp · Not Hesaplayıcı</title><style>@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');:root{--ink:#292342;--purple:#6446d8;--lilac:#f0edff;--line:#e4e0f2;--muted:#77718e}*{box-sizing:border-box}body{margin:0;background:#fff;font-family:Manrope,Arial,sans-serif;color:var(--ink)}.hero{max-width:1180px;margin:auto;padding:38px 46px 20px;display:flex;align-items:end;justify-content:space-between;gap:20px}.hero p{color:var(--purple);font-weight:800;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;margin:0 0 11px}.hero h1{font-size:clamp(1.8rem,4vw,3.2rem);letter-spacing:-.065em;line-height:1;margin:0}.hero:after{content:'01';font-size:6rem;font-weight:800;color:#f0edff;line-height:.8}.layout{max-width:1180px;margin:0 auto;padding:24px 46px 48px;display:grid;grid-template-columns:1fr 340px;gap:18px}.panel{border:1px solid var(--line);border-radius:12px;padding:24px}.panel:first-child{border-top:6px solid var(--purple)}h2{font-size:1rem;margin:0 0 7px;letter-spacing:-.03em}.help{margin:0 0 18px;color:var(--muted);font-size:.86rem}.section{margin-top:25px;padding-top:24px;border-top:1px solid var(--line)}.section-title{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:14px}.section-title span{font-size:.75rem;color:var(--purple);font-weight:800}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.finals{padding:14px;background:var(--lilac);border-radius:9px}.field label{display:flex;justify-content:space-between;font-size:.77rem;font-weight:800;margin:0 0 6px}.field b{color:var(--purple)}input,select{border:1px solid #d5d0e6;border-radius:6px;padding:11px;width:100%;font:inherit;color:var(--ink);background:#fff}input:focus,select:focus{outline:3px solid #dcd4ff;border-color:var(--purple)}.result{background:var(--purple);color:#fff;align-self:start;position:sticky;top:20px;border:0}.result h2{color:#dcd4ff}.score{font-size:3.65rem;font-weight:800;letter-spacing:-.09em;margin:25px 0 11px}.score small{font-size:.85rem;letter-spacing:0;color:#dcd4ff}.badge{font-size:.76rem;font-weight:800;padding:7px 10px;background:#fff;color:var(--purple);border-radius:6px}.lines{margin-top:26px}.line{display:flex;justify-content:space-between;padding:13px 0;border-top:1px solid #ffffff36;color:#e4dfff;font-size:.83rem}.line strong{color:#fff}@media(max-width:760px){.hero{padding:28px 22px 9px}.hero:after{display:none}.layout{padding:20px 16px;grid-template-columns:1fr}.result{position:static;order:-1}.fields{grid-template-columns:1fr}}</style></head><body><header class="hero"><div><p>Gülhane Tıp · 2026-2027</p><h1>Not hesaplayıcı</h1></div></header><main class="layout"><section class="panel"><h2>Dönem seçimi</h2><p class="help">Kurul ağırlıkları sınıfına göre güncellenir.</p><select id="grade"><option value="1">1. sınıf</option><option value="2">2. sınıf</option><option value="3">3. sınıf</option></select><div class="section"><div class="section-title"><h2>Kurullar</h2><span>%60</span></div><div class="fields" id="boards"></div></div><div class="section"><div class="section-title"><h2>Yıl sonu / bütünleme</h2><span>%40</span></div><div class="fields finals" id="finals"></div></div></section><aside class="panel result"><h2>Başarı notun</h2><div class="score" id="score">0,00 <small>/ 100</small></div><span class="badge" id="badge" hidden></span><div class="lines"><div class="line"><span>Kurullar</span><strong id="boardPart">0,00</strong></div><div class="line"><span>Yıl sonu</span><strong id="finalPart">0,00</strong></div><div class="line"><span>Kurul ortalaması</span><strong id="boardAverage">0,00</strong></div></div></aside></main><script>const data={1:{boards:[['1. Kurul',19.07],['2. Kurul',19.42],['3. Kurul',24.25],['4. Kurul',21.40],['5. Kurul',15.86]],finals:[['Sosyal sorumluluk',2],['Mesleki beceri',9],['Laboratuvar',14],['Teorik',75]]},2:{boards:[['1. Kurul',23.74],['2. Kurul',16.63],['3. Kurul',12.14],['4. Kurul',18.03],['5. Kurul',14.73],['6. Kurul',14.73]],finals:[['Bilimsel düşünme ve planlama',3],['Mesleki beceri',9],['Laboratuvar',13],['Teorik',75]]},3:{boards:[['1. Kurul',9.94],['2. Kurul',19.75],['3. Kurul',18.37],['4. Kurul',21.97],['5. Kurul',16.02],['6. Kurul',13.95]],finals:[['Bilimsel düşünme ve planlama',3],['Mesleki beceri',9],['Topluma dayalı tıp uygulamaları',3],['Teorik',85]]}};const $=s=>document.querySelector(s),format=n=>n.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}),clamp=n=>Math.max(0,Math.min(100,Number(n)||0));function input(n,w,t){return`<div class="field"><label>${n}<b>%${String(w).replace('.',',')}</b></label><input class="${t}" data-weight="${w}" type="number" inputmode="decimal" min="0" max="100" step=".01" placeholder="0 - 100"></div>`}function weighted(s){return[...document.querySelectorAll(s)].reduce((a,n)=>a+clamp(n.value)*Number(n.dataset.weight)/100,0)}function draw(){let d=data[$('#grade').value];$('#boards').innerHTML=d.boards.map(x=>input(x[0],x[1],'board')).join('');$('#finals').innerHTML=d.finals.map(x=>input(x[0],x[1],'final')).join('');document.querySelectorAll('input').forEach(n=>n.addEventListener('input',calculate));calculate()}function calculate(){let a=weighted('.board'),f=weighted('.final'),b=a*.6,y=f*.4,t=b+y;$('#score').innerHTML=`${format(t)} <small>/ 100</small>`;$('#boardPart').textContent=format(b);$('#finalPart').textContent=format(y);$('#boardAverage').textContent=format(a);let k=[...document.querySelectorAll('.board')],g=[...document.querySelectorAll('input')].some(x=>x.value!==''),m=k.every(x=>clamp(x.value)>=60)&&a>=80,e=g&&k.some(x=>clamp(x.value)<50),r=$('#badge');r.textContent=m?'Muafiyet olası':e?'Telafi gerekebilir':g?(t>=60?'Başarılı görünüyorsun':'Geçme notunun altında'):'';r.hidden=!r.textContent}$('#grade').addEventListener('change',draw);draw();</script></body></html>
